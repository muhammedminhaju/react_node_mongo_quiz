<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <div>
            <h2>Quiz App</h2>
          </div>
        </div>
        <nav class="nav-links">
          <a href="/">Dashboard</a>
          <a href="/quiz">Quiz</a>
          <a href="/revision">Revision</a>
          <a href="/history">History</a>
          <a href="/questions">Question Management</a>
          <a href="/topics">Topics</a>
          <a href="/settings" class="active">Settings</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-menu">☰</button>
          <div class="topbar-title">Settings</div>
        </header>

        <section class="content-card settings-card">
          <div class="field-group">
            <label>Number of questions</label>
            <input id="settingQuestionCount" type="number" min="5" max="100" value="20" />
          </div>
          <div class="checkbox-row">
            <label><input id="shuffleQuestionsSetting" type="checkbox" checked /> Shuffle questions</label>
          </div>
          <div class="checkbox-row">
            <label><input id="shuffleOptionsSetting" type="checkbox" checked /> Shuffle options</label>
          </div>
          <div class="checkbox-row">
            <label><input id="showExplanationSetting" type="checkbox" checked /> Show explanation</label>
          </div>
          <div class="checkbox-row">
            <label><input id="darkModeSetting" type="checkbox" /> Dark mode</label>
          </div>
          <div class="checkbox-row">
            <label><input id="confirmSubmitSetting" type="checkbox" checked /> Confirm before submitting</label>
          </div>
          <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
