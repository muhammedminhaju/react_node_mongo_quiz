<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Result</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <div>
            <h2>Quiz App</h2>
          </div>
        </div>
        <nav class="nav-links">
          <a href="/">Dashboard</a>
          <a href="/quiz">Quiz</a>
          <a href="/revision">Revision</a>
          <a href="/history">History</a>
          <a href="/questions">Question Management</a>
          <a href="/topics">Topics</a>
          <a href="/settings">Settings</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-menu">☰</button>
          <div class="topbar-title">Quiz Result</div>
        </header>

        <section class="content-card">
          <div class="result-header">
            <h2>Quiz Completed</h2>
            <div class="score-large" id="scoreSummary">0 / 0</div>
            <div id="percentageSummary">0%</div>
          </div>

          <div class="result-stats">
            <div><strong>Correct:</strong> <span id="correctCount">0</span></div>
            <div><strong>Wrong:</strong> <span id="wrongCount">0</span></div>
            <div><strong>Unanswered:</strong> <span id="unansweredCount">0</span></div>
          </div>

          <div class="result-actions">
            <button class="btn btn-primary" id="reviewBtn">Review Answers</button>
            <button class="btn btn-secondary" id="tryAgainBtn">Try Again</button>
            <button class="btn btn-dark" id="backToTopicsBtn">Back to Topics</button>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/result.js"></script>
  </body>
</html>
