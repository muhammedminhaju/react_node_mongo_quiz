<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question Management</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <div>
            <h2>Quiz App</h2>
          </div>
        </div>
        <nav class="nav-links">
          <a href="/">Dashboard</a>
          <a href="/quiz">Quiz</a>
          <a href="/revision">Revision</a>
          <a href="/history">History</a>
          <a href="/questions" class="active">Question Management</a>
          <a href="/topics">Topics</a>
          <a href="/settings">Settings</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-menu">☰</button>
          <div class="topbar-title">Question Management</div>
          <div class="topbar-actions">
            <button class="btn btn-primary" id="addQuestionBtn">+ Add Question</button>
          </div>
        </header>

        <section class="content-card">
          <div class="toolbar-row">
            <div class="field-group">
              <label for="topicFilter">Topic:</label>
              <select id="topicFilter"></select>
            </div>
            <div class="field-group search-field">
              <label for="searchInput">Search:</label>
              <input id="searchInput" type="text" placeholder="Search questions..." />
            </div>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Question</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="questionsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div class="modal hidden" id="questionModal">
      <div class="modal-card wide-modal">
        <h3 id="questionModalTitle">Add Question</h3>
        <form id="questionForm">
          <div class="field-group">
            <label>Topic</label>
            <select id="questionTopic" required></select>
          </div>

          <div class="field-group">
            <label>Question</label>
            <textarea id="questionTextInput" rows="3" required></textarea>
          </div>

          <div class="form-grid">
            <div class="field-group">
              <label>Option A</label>
              <input id="optionA" type="text" required />
            </div>
            <div class="field-group">
              <label>Option B</label>
              <input id="optionB" type="text" required />
            </div>
            <div class="field-group">
              <label>Option C</label>
              <input id="optionC" type="text" required />
            </div>
            <div class="field-group">
              <label>Option D</label>
              <input id="optionD" type="text" required />
            </div>
          </div>

          <div class="field-group">
            <label>Correct Answer</label>
            <select id="correctAnswerSelect"></select>
          </div>

          <div class="field-group">
            <label>Explanation</label>
            <textarea id="questionExplanation" rows="3"></textarea>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelQuestionBtn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveQuestionBtn">Save Question</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal hidden" id="deleteQuestionModal">
      <div class="modal-card">
        <h3>Delete Question?</h3>
        <p>Are you sure you want to permanently delete this question?</p>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="cancelDeleteQuestionBtn">Cancel</button>
          <button class="btn btn-danger" id="confirmDeleteQuestionBtn">Delete</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/questions.js"></script>
  </body>
</html>
