<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revision</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <div>
            <h2>Quiz App</h2>
          </div>
        </div>
        <nav class="nav-links">
          <a href="/">Dashboard</a>
          <a href="/quiz">Quiz</a>
          <a href="/revision" class="active">Revision</a>
          <a href="/history">History</a>
          <a href="/questions">Question Management</a>
          <a href="/topics">Topics</a>
          <a href="/settings">Settings</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-menu">☰</button>
          <div class="topbar-title">Revision</div>
        </header>

        <section class="content-card revision-card">
          <div class="field-group">
            <label>Topics</label>
            <div id="revisionTopics" class="checklist"></div>
          </div>

          <div class="field-group">
            <label>Number of Questions</label>
            <select id="revisionCountSelect">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="all">All</option>
            </select>
          </div>

          <button class="btn btn-primary" id="startRevisionBtn">Start Revision</button>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
