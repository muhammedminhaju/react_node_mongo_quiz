<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz History</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <div>
            <h2>Quiz App</h2>
          </div>
        </div>
        <nav class="nav-links">
          <a href="/">Dashboard</a>
          <a href="/quiz">Quiz</a>
          <a href="/revision">Revision</a>
          <a href="/history" class="active">History</a>
          <a href="/questions">Question Management</a>
          <a href="/topics">Topics</a>
          <a href="/settings">Settings</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-menu">☰</button>
          <div class="topbar-title">Quiz History</div>
          <div class="topbar-actions">
            <button class="btn btn-danger" id="clearHistoryBtn">Clear All History</button>
          </div>
        </header>

        <section class="content-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Topic</th>
                <th>Date</th>
                <th>Score</th>
                <th>Percentage</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </section>
      </main>
    </div>

    <div class="modal hidden" id="historyModal">
      <div class="modal-card wide-modal">
        <h3>Quiz Result Details</h3>
        <div id="historyDetailContent"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="closeHistoryDetailBtn">Close</button>
        </div>
      </div>
    </div>

    <div class="modal hidden" id="confirmHistoryDeleteModal">
      <div class="modal-card">
        <h3>Delete Result?</h3>
        <p>Are you sure you want to delete this result?</p>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="cancelDeleteHistoryBtn">Cancel</button>
          <button class="btn btn-danger" id="confirmDeleteHistoryBtn">Delete</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/history.js"></script>
  </body>
</html>
